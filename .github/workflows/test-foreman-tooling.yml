name: foreman tooling tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Local verify (CI parity)
        env:
          FOREMAN_VERIFY_INSTALL: "1"
        run: bash scripts/verify.sh

