name: foreman tooling tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Syntax check — hooks
        run: |
          bash -n hooks/pre-push
          bash -n hooks/commit-msg
          bash -n hooks/install.sh
          bash -n scripts/foreman-dispatch.sh
          bash -n scripts/foreman-close.sh
          bash -n scripts/foreman-status.sh
          bash -n scripts/foreman-merge-check.sh
          bash -n scripts/foreman-drift-check.sh
          bash -n scripts/foreman-pr-prep.sh

      - name: Compile check — Python scripts
        run: |
          python3 -m py_compile scripts/foreman-review.py
          python3 -m py_compile scripts/foreman-classify.py
          python3 -m py_compile scripts/foreman-mcp-shim.py
          python3 -m py_compile scripts/foreman-mcp-server.py
          python3 -m py_compile scripts/foreman-calibration.py 2>/dev/null || \
            echo "foreman-calibration.py not yet present — skipping"

      - name: Reviewer smoke tests
        run: python3 scripts/test-review.py

      - name: Hook smoke tests
        run: bash scripts/test-hooks.sh

      - name: MCP shim help check
        run: python3 scripts/foreman-mcp-shim.py --help 2>&1 | grep -q "tool" || \
          python3 scripts/foreman-mcp-shim.py --tool foreman_review \
            --args '{"diff":"","author_model":"codex","branch":"test"}' | \
          python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('verdict')=='APPROVE'"

      - name: MCP server smoke check
        run: |
          python3 <<'PY'
          from scripts.foreman_mcp_server import mcp

          print(f"tools: {list(mcp._tools.keys())}")
          PY

  test-trailer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Syntax check — trailer-check workflow
        run: |
          python3 <<'PY'
          import yaml

          with open('.github/workflows/foreman-trailer-check.yml', encoding='utf-8') as f:
              doc = yaml.safe_load(f)

          print('trailer-check.yml: valid YAML')
          triggers = doc.get(True) if True in doc else doc.get('on', {})
          print('triggers:', list(triggers.keys()))
          PY
